name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs, but let push-to-main runs finish: the full build
# is what populates the cachix cache, and cancelling it mid-run on every
# successive push keeps the cache permanently cold.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (statix, deadnix, treefmt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      - name: Build lint checks
        run: nix build --no-update-lock-file --keep-going -L .#checks.x86_64-linux.lint

  eval:
    name: Eval NixOS hosts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
        with:
          deploy-key: ${{ secrets.PRAGMATA_PRO_DEPLOY_KEY }}
      - name: Evaluate system closures (no build)
        run: nix eval --no-update-lock-file .#checks.x86_64-linux.nixos-hosts.drvPath

  full-build:
    name: Full system build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: eval
    env:
      CACHIX_CACHE: abdullaev-dotfiles
      CACHIX_ENABLED: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      - uses: ./.github/actions/setup-nix
        with:
          deploy-key: ${{ secrets.PRAGMATA_PRO_DEPLOY_KEY }}
      - name: Set up Cachix
        if: env.CACHIX_ENABLED == 'true'
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Build full system closure
        run: |
          nix build --no-update-lock-file --no-link -L \
            .#checks.x86_64-linux.nixos-hosts
      # Never push from pull_request runs: the cache is trusted by every
      # substituting machine, so only reviewed (pushed/dispatched) code may
      # populate it. PR builds still substitute from the cache via skipPush.
      - name: Push locally-built paths to Cachix
        if: env.CACHIX_ENABLED == 'true' && github.event_name != 'pull_request'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: ./.github/scripts/cachix-push.sh
