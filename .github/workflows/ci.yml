name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs, but let push-to-main runs finish: the full build
# is what populates the cachix cache, and cancelling it mid-run on every
# successive push keeps the cache permanently cold.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (statix, deadnix, treefmt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      - name: Build lint checks
        run: nix build --no-update-lock-file --keep-going -L .#checks.x86_64-linux.lint

  eval:
    name: Eval NixOS hosts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
        with:
          deploy-key: ${{ secrets.PRAGMATA_PRO_DEPLOY_KEY }}
      - name: Evaluate system closures (no build)
        run: nix eval --no-update-lock-file .#checks.x86_64-linux.nixos-hosts.drvPath

  full-build:
    name: Full system build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: eval
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    env:
      CACHIX_CACHE: abdullaev-dotfiles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      - uses: ./.github/actions/setup-nix
        with:
          deploy-key: ${{ secrets.PRAGMATA_PRO_DEPLOY_KEY }}
      - name: Set up Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          skipPush: true
      - name: Build full system closure
        run: |
          nix build --no-update-lock-file --no-link -L \
            .#checks.x86_64-linux.nixos-hosts

  publish:
    name: Build and publish main
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: [lint, eval]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # This environment allows only protected main, where PR approval is required.
    # Keep CACHIX_PUBLISH_TOKEN exclusively as an environment secret.
    environment: cachix-publish
    env:
      CACHIX_CACHE: abdullaev-dotfiles
    steps:
      - name: Require publishing credential
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_PUBLISH_TOKEN }}
        run: ': "${CACHIX_AUTH_TOKEN:?Configure CACHIX_PUBLISH_TOKEN in the protected cachix-publish environment}"'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      - uses: ./.github/actions/setup-nix
        with:
          deploy-key: ${{ secrets.PRAGMATA_PRO_DEPLOY_KEY }}
      - name: Set up Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          skipPush: true
      - name: Build full system closure
        run: |
          nix build --no-update-lock-file --no-link -L \
            .#checks.x86_64-linux.nixos-hosts
      - name: Push locally-built paths to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_PUBLISH_TOKEN }}
        run: ./.github/scripts/cachix-push.sh
