name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (statix, deadnix, treefmt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            download-attempts = 5
            connect-timeout = 10
      # Build individual check attrs, NOT `nix flake check` — the latter also
      # evaluates nixos-hosts, which forces the private pragmata-pro input
      # this job has no SSH key for.
      - name: Build lint checks
        run: |
          nix build --no-update-lock-file --keep-going -L \
            .#checks.x86_64-linux.statix \
            .#checks.x86_64-linux.deadnix \
            .#checks.x86_64-linux.treefmt

  eval:
    name: Eval vega system
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets are absent on fork PRs; skip there (lint still runs).
    if: ${{ !github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@v7
      - name: Load deploy key for private font repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRAGMATA_PRO_DEPLOY_KEY }}
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            download-attempts = 5
            connect-timeout = 10
      # Instantiates the full derivation graph without building the ~30 GiB
      # closure. Catches eval/module/assertion errors, not build failures.
      - name: Evaluate system closure (no build)
        run: |
          nix eval --raw --no-update-lock-file \
            .#nixosConfigurations.vega.config.system.build.toplevel.drvPath
          echo

  full-build:
    name: Full system build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: eval
    # The ~30 GiB closure build: only on the weekly update-flake-lock PRs
    # (their head branch is fixed) and manual dispatch — never on regular PRs.
    if: (github.event_name == 'pull_request' && github.head_ref == 'update_flake_lock_action') || github.event_name == 'workflow_dispatch'
    env:
      CACHIX_CACHE: abdullaev-dotfiles
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # Frees ~115 GB for /nix by purging runner bloat; must precede Nix install.
      - uses: wimpysworld/nothing-but-nix@v10
      - name: Load deploy key for private font repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRAGMATA_PRO_DEPLOY_KEY }}
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            download-attempts = 5
            connect-timeout = 10
      # Configures the cache as a substituter (pull) and installs the CLI.
      # Skipped until the CACHIX_AUTH_TOKEN secret exists, keeping CI green.
      - name: Set up Cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Build full system closure
        run: |
          nix build --no-update-lock-file --no-link -L \
            .#checks.x86_64-linux.nixos-hosts
      # Push only what this job compiled: skip .drv files, flake sources,
      # fixed-output (re-downloadable) paths, and anything cache.nixos.org
      # already serves — the full closure would blow the 5 GB free tier.
      # pragmata-pro is a commercial font and must never reach a public
      # cache; chrome/obsidian are repackaged downloads not worth caching.
      # CRITICAL: cachix push uploads the CLOSURE of each given path, so
      # name-filtering alone is not enough — any aggregate (system-path,
      # profiles) referencing an excluded package would drag it back in.
      # Subtracting the referrers-closure of excluded paths guarantees no
      # pushed path transitively contains them.
      - name: Push locally-built paths to Cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        run: |
          nix path-info --all --json | jq -r 'to_entries[]
            | select(.key | endswith(".drv") | not)
            | select(.key | test("-source$") | not)
            | select((.value.ca // "") == "")
            | select(((.value.signatures // []) | map(startswith("cache.nixos.org")) | any) | not)
            | .key' | sort -u > candidates.txt
          grep -E 'pragmata|google-chrome|obsidian' candidates.txt > bad.txt || true
          if [ -s bad.txt ]; then
            xargs nix-store -q --referrers-closure < bad.txt | sort -u > excluded.txt
          else
            : > excluded.txt
          fi
          comm -23 candidates.txt excluded.txt | tee pushed.txt | cachix push "$CACHIX_CACHE"
          echo "Pushed $(wc -l < pushed.txt) paths ($(wc -l < excluded.txt) excluded as non-redistributable or depending on such)"

  cve-scan:
    name: CVE scan (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Runs only when full-build succeeded (same gating: update PRs and
    # manual dispatch). By then all compiles are in Cachix, so realizing
    # the closure here is downloads-only — no compiling.
    needs: full-build
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      # holster (not cleave): takes only /mnt (~65 GB, enough for the closure)
      # and leaves / untouched — grype's DB hydration needs several GB of
      # scratch on / that cleave would have drained into the /nix pool.
      - uses: wimpysworld/nothing-but-nix@v10
        with:
          hatchet-protocol: holster
      - name: Load deploy key for private font repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRAGMATA_PRO_DEPLOY_KEY }}
      # Pull-only cachix access needs no token — just substituter + key.
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            download-attempts = 5
            connect-timeout = 10
            extra-substituters = https://abdullaev-dotfiles.cachix.org
            extra-trusted-public-keys = abdullaev-dotfiles.cachix.org-1:ojAEcXkl3aLb8O7Cyt8JOk3yBljFwf/jcUC58Ha3KQ0=
      # On update PRs the base closure is scanned too (same job = same
      # vulnerability-DB snapshot), so the report can attribute every
      # difference to the update itself.
      - name: Checkout PR base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: Realize system closure from caches
        run: |
          nix build --no-update-lock-file --no-link -L \
            .#checks.x86_64-linux.nixos-hosts
      # vulnxscan = grype + osv.dev + vulnix. On update PRs the comment
      # shows only CVEs introduced/fixed by the update (pre-existing ones
      # are a count; full CSVs in the artifact). Advisory for findings,
      # but scanner BREAKAGE fails the job loudly (hence no || true).
      - name: Scan closure for known CVEs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Scanner DBs (grype's alone is ~7 GB) fit neither / nor the
          # residual /mnt; the /nix pool is the only roomy filesystem left,
          # and non-store dirs there are safe (gc ignores them).
          sudo mkdir -p /nix/scanner-cache && sudo chown "$(id -un)" /nix/scanner-cache
          export XDG_CACHE_HOME=/nix/scanner-cache
          target=$(nix build --no-update-lock-file --no-link --print-out-paths \
            .#checks.x86_64-linux.nixos-hosts)
          nix shell --inputs-from . nixpkgs#sbomnix -c vulnxscan -o vulns.csv "$target"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_target=$(nix build --no-update-lock-file --no-link --print-out-paths \
              ./base#checks.x86_64-linux.nixos-hosts)
            nix shell --inputs-from . nixpkgs#sbomnix -c vulnxscan -o base-vulns.csv "$base_target"
            ./.github/scripts/cve-report.sh vulns.csv base-vulns.csv
          else
            ./.github/scripts/cve-report.sh vulns.csv
          fi
          cat cve-report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file cve-report.md
          fi
      - name: Upload full CVE report
        uses: actions/upload-artifact@v7
        with:
          name: cve-report
          path: |
            vulns.csv
            base-vulns.csv
