name: Update flake.lock

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Re-locking fetches ALL inputs, including the private font repo.
      - uses: ./.github/actions/setup-nix
        with:
          deploy-key: ${{ secrets.PRAGMATA_PRO_DEPLOY_KEY }}
      - name: Update flake.lock and open PR
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          # PAT (not GITHUB_TOKEN) so the created PR triggers the CI workflow.
          token: ${{ secrets.GH_PAT_FLAKE_UPDATE }}
          # Pinned explicitly (not left to the action's default): ci.yml
          # gates full-build on this exact branch name.
          branch: update_flake_lock_action
          pr-title: "flake.lock: update"
